# When someone leaves, move their entry; do not delete it.
#   Member who graduates -> alumni_graduate or alumni_undergraduate. Keep `photo:` if they had one (rendered 28px,
#     the original scaled down). `role` becomes `note`, ending "Graduated YYYY" (graduates are listed newest first).
#   Collaborator who is no longer one -> a new `collaborators_former:` list (add the key at the first entry; the
#     page shows a folded "Former collaborators" list only when it has entries), same fields: name, role,
#     affiliation, photo. `role` and `affiliation` are where the person is now, if known, otherwise their last role with the lab.
# Photos: one that is already on this site stays with the person after they leave, and comes off on request.
# Anyone who never had a photo here is not photographed without their consent first. Alumni without a photo
# get a small name-seeded ring.
