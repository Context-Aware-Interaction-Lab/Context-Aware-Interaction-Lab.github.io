themes:
  - title: "Mental Healthcare and Wellbeing"
    items:
      - "We are develop new ways of supporting stakeholders in mental healthcare with AI. This work looks at combining methods from human-computer interaction and natural language processing to improve the services in dimensions such as conversational support, emotion detection, and passive sensing of behavioural metrics."
  - title: "Human-AI Interaction"
    items:
      - "We are developing a novel system to support children who have communication delays. This system adopts a multi-modal approach to sense non-verbal and speech-language interactions to provide data-driven insights to support better parent-child interaction."
      - "We are working with the [Singapore Aquatics](https://www.sgaquatics.org.sg/) to develop a drone-based system to derive swimming analytics. This work combines methods from human-computer interaction, human-robot interaction, and computer vision to overcome system challenges to develop a scalable and robust means to track swimming performance at elite levels."
      - "We are studying the dynamics of using Large-Language Models to generate and counter against misinformation."
