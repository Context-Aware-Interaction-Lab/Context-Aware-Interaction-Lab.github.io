  text: |-
    Our paper "Dronaquatics: Real-time Swimming Analytics Using Drone Captured Imagery" was accepted in WACV 2026! Congratulations to all authors!
- date: "Nov 2025"
  text: |-
    Two papers on AI-assisted debugging, written with collaborators, were presented this month:
    - ["Simulated Interactive Debugging"](https://doi.org/10.1109/ASE63991.2025.00338) at ASE 2025 in Seoul.
    - ["Designing for Novice Debuggers: A Pilot Study on an AI-Assisted Debugging Tool"](https://doi.org/10.1145/3769994.3769997) at Koli Calling 2025.
- date: "Nov 2025"
  text: |-
    - Our paper "[TalkSketch: Multimodal Generative AI for Real-time Sketch Ideation with Speech](https://arxiv.org/abs/2511.05817)" was accepted in AAAI CLIP 2025! Congratulations to all authors!
