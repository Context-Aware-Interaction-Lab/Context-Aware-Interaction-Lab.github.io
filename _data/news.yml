- date: "Oct 2026"
  text: |-
    Two papers are now published in PACM HCI, for CSCW 2026 (October):
    - "'Is This Really a Human Peer Supporter?': Misalignments Between Peer Supporters and Experts in LLM-Supported Interactions", led by Kellie Sim. \[[paper](https://doi.org/10.1145/3816956)\]
    - "Sword and Shield: Uses and Strategies of LLMs in Navigating Disinformation", led by Gionnieve Lim, with Kellie Sim and Weiyan Shi. \[[paper](https://doi.org/10.1145/3817008)\]
- date: "Sep 2026"
  text: |-
    Welcome to our two new PhD students, Nguyen Quoc Nam and Swarangi Subodh Mehta, who joined the lab this month! 🎉
- date: "Sep 2026"
  text: |-
    A busy year of invited talks and panels for our director, Kenny Choo:
    - "AI for Parent–Child Interaction", Science of Learning Seminar Series, National Institute of Education (Sep)
    - "The Era of Human–AI Co-Intelligence for Behavioural Design", Behavioural and Implementation Sciences in Health Asia Conference, BISHAC 2026 (Sep)
    - "Human-Centred Conversation between AI Product Teams and Domain Experts", GovTech Conscious Builder series (Aug)
    - "When AI Becomes Relational: Trust, Intimacy and Responsibility", moderator, LorongAI panel (Aug)
    - "Designing for Care, Consent, and Wellbeing: Human-Centered AI in Family and Mental Health Contexts", AI Governance & Privacy Symposium, Yonsei University (May)
    - "Designing for 'We': Expanding Collective Capability through Society-Centred AI", at NUS Industrial Design (Mar), KAIST Computer Science (Mar) and CityU School of Creative Media (Feb)
- date: "Sep 2026"
  text: |-
    Congratulations to PhD student Kellie Sim, who received the Top Seed Award at the Design Business Chamber Singapore (DBCS) Seed Award 2026 — one of only 10 recipients! 🎉 A wonderful recognition of her work.

    Congratulations also to PhD student Weiyan Shi, who received a Seed Award at the same DBCS Seed Award 2026! 🎉
- date: "Jun 2026"
  text: |-
    A nice showing at DIS 2026 — three papers accepted to the Provocations & Works-in-Progress track!
    - ["Acts of Configuration: Rethinking Provenance, Temporality and Legitimacy in Post-Mortem Agents](https://dl.acm.org/doi/full/10.1145/3802974.3809435)" — led by Kellie Sim, with Master's students Darryl Lim and John-Henry Lim.
    - ["'I'm Not Able to Be There for You': Emotional Labour, Responsibility, and AI in Peer Support"](https://dl.acm.org/doi/full/10.1145/3802974.3809470) — led by Kellie Sim.
    - ["When Drawing Is Not Enough: Exploring Spontaneous Speech with Sketch for Intent Alignment in Multimodal LLMs"](https://dl.acm.org/doi/full/10.1145/3802974.3809463) — led by Weiyan Shi.
- date: "Apr 2026"
  text: |-
    Two workshop papers from the lab at CHI 2026 in Barcelona:
    - ["More Than 1v1: Human-AI Alignment in Early Developmental Communities with Multimodal LLMs"](https://doi.org/10.48550/arXiv.2603.07134), led by Weiyan Shi.
    - ["Redistributing Voice and Responsibility: AI in Relationship-Centred Care"](https://doi.org/10.48550/arXiv.2606.00028), led by Kellie Sim.
- date: "Apr 2026"
  text: |-
    Congratulations to our Master's students in Technology Entrepreneurship who graduated this month: Aaron Zhe Yu Tua, Yong Lin Tan, Kelvin Xian Yao Thian, Valencia Arlin Halim and Nicholas Shin Shoon Teng! 🎓 We are proud of the work you did with us, and wish you all the best.
- date: "Feb 2026"
  text: |-
    ["TalkSketch: Multimodal Generative AI for Real-Time Sketch Ideation with Speech"](https://link.springer.com/chapter/10.1007/978-3-032-16893-1_6), led by Weiyan Shi, is out in the Springer volume Creative AI for Live  Interactive Performances! Congratulations to all authors.
- date: "Jan 2026"
  text: |-
    A fantastic start to the year for the lab at CHI!
    - Huge congratulations to PhD students Weiyan Shi and Kellie Sim — both had papers accepted to CHI 2026, and both received a Best Paper Honourable Mention Award (top 5% of submissions)! 🎉🏆
      - "Words to Describe What I'm Feeling: Exploring the Potential of AI Agents for High Subjectivity Decisions in Advance Care Planning", led by Kellie Sim — Honourable Mention Award. \[Check out [our paper](https://dl.acm.org/doi/full/10.1145/3772318.3791335)!\]
      - "Towards Aligning Multimodal LLMs with Human Experts: A Focus on Parent-Child Interaction", led by Weiyan Shi — Honourable Mention Award. \[Check out [our paper](https://dl.acm.org/doi/10.1145/3772318.3791267)!\]
    - Two honourable mentions in the same CHI cycle — huge congratulations to all authors and collaborators!
    - Two Late-Breaking Works accepted to CHI 2026!
      - ["Foreign Domestic Workers' Perspectives on an LLM-Based Emotional Support Tool for Caregiving Burden"](https://dl.acm.org/doi/full/10.1145/3772363.3798761), led by Master's student Nicholas Teng — great to see thesis work reach CHI.
      - ["A Taxonomy of Human–MLLM Interaction in Early-Stage Sketch-Based Design Ideation"](https://dl.acm.org/doi/full/10.1145/3772363.3798524), led by Weiyan Shi.
- date: "Jan 2026"
  text: |-
