name: Context-Aware Interaction Lab
short_name: CAILab
affiliation: Singapore University of Technology and Design
mission: >-
  The Context-Aware Interaction Lab (CAILab) is a Human-Computer Interaction
  research lab at the Singapore University of Technology and Design (SUTD)
  working on Human-Centred AI: AI systems that people can understand, question,
  and act with, in sensitive, high-stakes settings.
recruitment: We're always on the lookout for motivated and talented PhD candidates!
join_lead: At CAILab, we aim to develop and train the next generation of Human-Centred AI researchers and designers.

