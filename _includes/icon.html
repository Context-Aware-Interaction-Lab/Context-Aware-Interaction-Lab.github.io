{%- comment -%}
  Line icons for the Join Us themes: ink outlines (currentColor) plus one accent shape in the card's spectrum colour (--c).
  Decorative: the title beside each icon carries the meaning. name: workspace | overlap | impact | heart | mentor
{%- endcomment -%}
<svg class="icon" data-icon="{{ include.name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- case include.name -%}
{%- when "workspace" -%}
  <rect x="3" y="4" width="18" height="12" rx="2"/>
  <path d="M9 20h6M12 16v4"/>
  <polyline class="icon__a" points="8 10 11 13 16 8"/>
{%- when "overlap" -%}
  <circle cx="9" cy="9" r="5"/>
  <circle cx="15" cy="9" r="5"/>
  <circle cx="12" cy="14.5" r="5"/>
  <circle class="icon__a icon__fill" cx="12" cy="11.2" r="1.6"/>
{%- when "impact" -%}
  <path d="M3 3v18h18"/>
  <polyline class="icon__a" points="6.5 15.5 11 11 14 14 20 7.5"/>
  <polyline class="icon__a" points="15 7.5 20 7.5 20 12.5"/>
{%- when "heart" -%}
  <path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>
  <path class="icon__a" d="M12 12.5v3.5M10.25 14.25h3.5"/>
{%- when "mentor" -%}
  <circle cx="8.5" cy="7.5" r="3.2"/>
  <path d="M2.5 20v-1a6 6 0 0 1 12 0v1"/>
  <circle class="icon__a icon__fill" cx="17.5" cy="11" r="2.2"/>
  <path class="icon__a" d="M15.5 20v-.6a3.9 3.9 0 0 1 6.5-2.9"/>
{%- endcase -%}
</svg>
